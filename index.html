<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <!-- Enlaces de tipografia google fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300..900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">

  <title>Practica Front-end | Order summary card</title>
</head>
<body>
  <!-- Tarjeta -->
  <div class="card">
    <img class="card-img" src="./images/illustration-hero.svg" alt="imagen illustracion musica" lang="eager">
    <div class="card-text-body">
      <h2>Order Summary</h2>

      <p class="text-body">You can now listen to millions of songs, audiobooks, and podcasts on any 
      device anywhere you like!</p>

      <!-- Tarjeta anual plan -->
      <div class="card-plan">
        <div class="icon-texts">
            <img class="icono" src="/images/icon-music.svg" alt="icono de musica" loading="eager">
          <div class="grup-texts-card">
            <p class="card-name">Annual Plan</p>
            <p class="card-precio">$59.99/year</p>
          </div>          
        </div>
        <a class="enlace" href="">Change</a>
      </div>

        <!-- Botones -->
      <div class="grup-btns">
        <button class="btn-principal">Proceed to Payment</button>
        <button class="btn-secundario">Cancel Order</button>
      </div> 
    </div>      

  </div>
</body>
</html>
